name: Playwright BDD Tests
on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11' # Match your local version

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Install Playwright Browsers
      run: playwright install chromium --with-deps

    - name: Run Playwright BDD tests
      run: |
        mkdir -p VideoReports
        # Pass the specific path to your feature file
        behave features/Login.feature -f junit -o VideoReports/

    - name: Upload Test Reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: behave-playwright-reports
        path: VideoReports/  # Ensure this matches your record_video_dir
        retention-days: 30