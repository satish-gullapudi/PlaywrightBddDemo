name: Playwright BDD Tests
on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11' # Match your local version

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Install Playwright Browsers
      run: playwright install chromium --with-deps

    - name: Run Playwright BDD tests
      run: |
        # Replace 'behave' with your runner (e.g., 'pytest' or 'behave')
        behave 

    - name: Upload Test Reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report
        path: VideoReports/ # Adjust this path to where your framework saves reports
        retention-days: 30