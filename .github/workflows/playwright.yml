name: Playwright BDD Tests
on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip' # <--- This automatically caches your requirements

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Cache Playwright browsers
      id: playwright-cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-playwright-${{ steps.setup-python.outputs.python-version }}

    - name: Install Playwright Browsers
      if: steps.playwright-cache.outputs.cache-hit != 'true'
      run: playwright install chromium --with-deps

    - name: Run Playwright BDD tests
      run: |
        mkdir -p VideoReports
        # Use --junit and --junit-directory instead of -f junit
        behave features/Login.feature --junit --junit-directory VideoReports/

    - name: Upload Test Reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: behave-playwright-reports
        path: GithubReports/  # Ensure this matches your record_video_dir
        retention-days: 30